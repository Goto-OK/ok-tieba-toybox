plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.tieba.stats'
    compileSdk 34

    defaultConfig {
        applicationId "com.tieba.stats"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        buildPython("C:/Users/example/.dsh/dsh-runtimes/dsh-primary-runtime/dependencies/python/python.exe")
        pip {
            install("beautifulsoup4==4.15.0")
            install("openpyxl")
        }
    }
}
