[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ok-tieba-toybox"
dynamic = ["version"]
description = "OK的贴吧玩具箱：贴吧楼层、楼中楼与用户分析，导出 Excel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OK" }]
keywords = ["tieba", "baidu", "scraper", "excel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Utilities",
]
dependencies = [
    "openpyxl>=3.1",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
tieba-stats = "tieba_reply_stats.cli:main"
tieba-stats-gui = "tieba_gui:main"

[tool.setuptools]
py-modules = [
    "tieba_gui",
    "tieba_gui_export",
    "tieba_gui_grid",
    "tieba_gui_identity",
    "tieba_gui_layout",
    "tieba_gui_links",
    "tieba_gui_login",
    "tieba_gui_lookup",
    "tieba_gui_messages",
    "tieba_gui_people",
    "tieba_gui_profile",
    "tieba_gui_settings",
    "tieba_gui_settings_runtime",
    "tieba_gui_theme",
    "tieba_gui_tools",
    "tieba_gui_utils",
    "tieba_gui_workers",
]

[tool.setuptools.dynamic]
version = { attr = "tieba_reply_stats.version.__version__" }

[tool.setuptools.packages.find]
include = ["tieba_reply_stats*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    "android/project/app/src/main/python",
    "android/project/app/build",
    "dist",
    ".build",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = [
    "tieba_reply_stats",
    "tieba_gui.py",
    "tieba_gui_export.py",
    "tieba_gui_grid.py",
    "tieba_gui_identity.py",
    "tieba_gui_layout.py",
    "tieba_gui_links.py",
    "tieba_gui_login.py",
    "tieba_gui_lookup.py",
    "tieba_gui_messages.py",
    "tieba_gui_people.py",
    "tieba_gui_profile.py",
    "tieba_gui_settings.py",
    "tieba_gui_settings_runtime.py",
    "tieba_gui_theme.py",
    "tieba_gui_tools.py",
    "tieba_gui_utils.py",
    "tieba_gui_workers.py",
]
ignore_missing_imports = true
check_untyped_defs = true
