[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ok-tieba-toybox"
dynamic = ["version"]
description = "OK的贴吧玩具箱：贴吧楼层、楼中楼与用户分析，导出 Excel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OK" }]
keywords = ["tieba", "baidu", "scraper", "excel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Utilities",
]
dependencies = [
    "openpyxl>=3.1",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
tieba-stats = "tieba_reply_stats.cli:main"
tieba-stats-gui = "tieba_gui:main"

[tool.setuptools]
py-modules = ["tieba_gui"]

[tool.setuptools.dynamic]
version = { attr = "tieba_reply_stats.version.__version__" }

[tool.setuptools.packages.find]
include = ["tieba_reply_stats*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    "android/project/app/src/main/python",
    "android/project/app/build",
    "dist",
    ".build",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["tieba_reply_stats", "tieba_gui.py"]
ignore_missing_imports = true
check_untyped_defs = true
