name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # GitHub Windows runner 默认 cp1252，selftest 输出中文需要 UTF-8。
      PYTHONIOENCODING: "utf-8"
      # CI 不安装可选 WebView2 依赖；该离线检查在界面中只作信息展示。
      TIEBA_SKIP_WEBVIEW2_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Unit tests
        run: python -m pytest

      - name: Self test
        run: python tests/selftest.py
